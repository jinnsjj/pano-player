<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Direction grid pixel regression</title>
<style>body { background: #202020; color: white; font: 14px sans-serif; } .view { position: relative; } .view canvas { position: absolute; width: 100%; height: 100%; } #pano-thumbnail { display: none; }</style>
<h1>Direction grid pixel regression</h1><output id="result">Running</output><ul id="cases"></ul>
<script type="module">
import { drawDirectionGrid } from '/direction-grid.js';
import '/view.js';
try {
  for (const width of [800, 360]) {
    const host = document.createElement('div'); host.className = 'view';
    host.style.width = width + 'px'; host.style.height = Math.round(width * 9 / 16) + 'px'; document.body.append(host);
    const source = document.createElement('canvas'); source.width = 1024; source.height = 512;
    const ctx = source.getContext('2d'); ctx.fillStyle = '#202020'; ctx.fillRect(0, 0, 1024, 512);
    const grid = document.createElement('canvas'); grid.width = 2048; grid.height = 1024; drawDirectionGrid(grid, true);
    const map = document.createElement('canvas'); map.width = 140; map.height = 70;
    const video = { element: source, readyState: 4, paused: true, currentTime: 0 };
    const view = new window.FoaView(host, video, map, { setOrientation() {} }, grid);
    view.configure(true, true, '360');
    const sample = () => {
      view.render(); const gl = view.gpu.getContext();
      const pixels = new Uint8Array(gl.drawingBufferWidth * gl.drawingBufferHeight * 4);
      gl.readPixels(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
      return pixels;
    };
    const difference = (a, b) => a.reduce((total, value, i) => total + (i % 4 !== 3 && Math.abs(value - b[i]) > 8 ? 1 : 0), 0);
    const off = sample(); view.setGridEnabled(true); const on = sample();
    const visible = difference(off, on);
    drawDirectionGrid(grid, true, 0); view.setGridEnabled(true);
    if (difference(off, sample()) !== 0) throw new Error('Grid opacity zero did not clear');
    drawDirectionGrid(grid, true, 1); view.setGridEnabled(true);
    view.orient(.5, .2); const turned = sample(); const moved = difference(on, turned);
    view.setGridEnabled(false); const hidden = sample();
    if (visible < width || moved < width || difference(off, hidden) !== 0) throw new Error(`Blank, static or uncleared grid at ${width}: ${visible}/${moved}`);
    view.setGridEnabled(true); view.configure(true, true, '180'); view.orient(Math.PI, 0);
    const rear = sample(); view.setGridEnabled(false); const rearOff = sample();
    if (difference(rear, rearOff) < width) throw new Error('180 rear hemisphere lost directional grid');
    const item = document.createElement('li'); item.textContent = `PASS ${width}px: visible=${visible}, rotated=${moved}, toggle clears; 180 rear grid visible`; document.getElementById('cases').append(item);
    view.dispose(); host.remove();
  }
  document.getElementById('result').textContent = 'PASS: direction grid renders, rotates while paused, toggles cleanly and retains full-sphere coordinates';
} catch (error) { document.getElementById('result').textContent = 'FAIL: ' + error.message; }
</script></html>
